<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블로그 라이터 (개인용)</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #fff; --line: #e6e8ec; --text: #1b1d21; --sub: #6b7280;
    --primary: #2a5db0; --primary-dark: #1f4a92; --chip: #f1f3f5; --danger: #c0392b; --ok: #0f9d7a; --warn: #d9822b;
    --c0: #e03131; --c1: #1c7ed6; --c2: #d6336c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
  button, select, input, textarea { font-family: inherit; }
  button { cursor: pointer; }
  header { background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 24px; padding: 0 28px; height: 56px; }
  .logo { font-weight: 800; font-size: 17px; letter-spacing: -0.5px; }
  .tab { background: none; border: 0; height: 100%; padding: 0 2px; font-size: 13px; color: var(--sub); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--primary); font-weight: 700; border-bottom-color: var(--primary); }
  main { max-width: 880px; margin: 0 auto; padding: 28px 16px 80px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 26px; margin-bottom: 20px; }
  .card h2 { margin: 0 0 16px; font-size: 16px; }
  label.cap { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin: 16px 0 7px; }
  label.cap small { font-weight: 400; color: var(--sub); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 0; background: var(--chip); color: #4b5563; border-radius: 999px; padding: 8px 18px; font-size: 13px; font-weight: 600; }
  .chip.active { background: var(--primary); color: #fff; }
  input[type=text], textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; background: #fff; color: var(--text); outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(42,93,176,.12); }
  textarea { resize: vertical; min-height: 120px; line-height: 1.65; }
  .row { display: flex; gap: 8px; }
  .row > input { flex: 1; }
  .btn { border: 0; border-radius: 10px; padding: 0 18px; height: 42px; font-size: 13px; font-weight: 700; background: var(--primary); color: #fff; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--primary-dark); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: #374151; border: 1px solid var(--line); }
  .btn.dark { background: #111827; }
  .btn.wide { width: 100%; height: 48px; font-size: 14px; margin-top: 20px; }
  kbd { font: 700 10px/1 inherit; background: #f3f4f6; border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; margin-left: 6px; color: #374151; }
  .hint { font-size: 12px; color: var(--sub); margin: 6px 0 0; line-height: 1.5; }
  .status { font-size: 12px; margin: 8px 0 4px; color: var(--ok); }
  .status.warn { color: var(--danger); }
  .list-item { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; margin-bottom: 8px; font-size: 13px; color: var(--text); }
  .list-item:hover, .list-item.selected { border-color: var(--primary); background: #f5f9ff; }
  .list-item b { font-weight: 600; } .list-item span { display: block; margin-top: 3px; font-size: 11px; color: var(--sub); }
  .opts { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 18px; padding: 14px 16px; background: #f9fafb; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; }
  .opts label { display: flex; align-items: center; gap: 6px; }
  .opts select { width: auto; padding: 6px 10px; font-size: 12px; }
  .error { display: none; margin-top: 12px; color: var(--danger); font-size: 12px; white-space: pre-wrap; }
  .error.show { display: block; }
  details.manual { margin-top: 10px; font-size: 12px; color: var(--sub); }
  details.manual summary { cursor: pointer; }
  details.manual .row { margin-top: 8px; }
  .hidden { display: none !important; }

  /* 결과 */
  .result-box { border: 1px solid var(--line); border-radius: 10px; min-height: 180px; }
  .empty { text-align: center; padding: 56px 16px; color: var(--sub); font-size: 13px; }
  .barline { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--sub); flex-wrap: wrap; }
  .barline b { color: var(--text); }
  .article { padding: 22px 26px; font-size: 15px; line-height: 1.9; word-break: keep-all; }
  .article p { margin: 0 0 18px; }
  .article h3 { margin: 30px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); font-size: 18px; }
  .article mark { background: #ffec99; padding: 0 2px; font-weight: 700; }
  .article b { font-weight: 700; }
  .article .todo { background: #fff3bf; color: #b35c00; border-radius: 4px; padding: 1px 4px; font-weight: 700; font-size: 13px; }
  .article .tags { color: #1c7ed6; font-size: 13px; line-height: 1.9; }
  .article .mapline { color: var(--sub); font-size: 13px; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .quality { margin-top: 18px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .quality h4 { margin: 0; padding: 12px 16px; font-size: 13px; background: #f9fafb; border-bottom: 1px solid var(--line); }
  .qrow { display: grid; grid-template-columns: 22px 1.3fr 1.5fr 1.3fr; gap: 8px; padding: 9px 16px; font-size: 12px; border-bottom: 1px solid #f1f3f5; align-items: start; }
  .qrow:last-child { border-bottom: 0; }
  .qrow .ok { color: var(--ok); } .qrow .no { color: var(--warn); } .qrow .tg { color: var(--sub); }
  .notes { margin-top: 10px; font-size: 12px; color: var(--sub); }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #dbe4f5; border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: #e6fcf5; color: #0b7a5c; margin-right: 6px; }
  .badge.info { background: #e7f1ff; color: #1f4a92; }
  .li-row { display: flex; align-items: center; gap: 8px; }
  .li-row .list-item { flex: 1; margin-bottom: 0; }
  .li-row + .li-row { margin-top: 8px; }
  .x { border: 1px solid var(--line); background: #fff; border-radius: 50%; width: 30px; height: 30px; color: var(--sub); }
  @media (max-width: 640px) { header { padding: 0 14px; gap: 14px; } .card { padding: 18px 14px; } .article { padding: 16px; } .qrow { grid-template-columns: 22px 1fr; } .qrow .tg, .qrow .val { grid-column: 2; } }
</style>
</head>
<body>
<header>
  <div class="logo">블로그 라이터</div>
  <button class="tab active" id="tabWrite">원고 작성</button>
  <button class="tab" id="tabList">내 원고</button>
</header>

<main>
<section id="viewWrite">
  <div class="card">
    <h2>새 원고 만들기</h2>

    <label class="cap">글 종류</label>
    <div class="chips" id="chips">
      <button class="chip active" data-kind="info">정보글</button>
      <button class="chip" data-kind="food">맛집글</button>
    </div>

    <div id="foodBox" class="hidden">
      <label class="cap" for="placeQuery">매장 이름</label>
      <div class="row">
        <input type="text" id="placeQuery" maxlength="100" placeholder="예) 마포 락희옥" autocomplete="off">
        <button class="btn" id="btnPlace">자동 입력</button>
      </div>
      <div class="status" id="placeStatus"></div>
      <div id="placeList"></div>
      <details class="manual"><summary>직접 입력 (자동 입력을 쓰지 않을 때)</summary>
        <div class="row"><input type="text" id="mCategory" placeholder="업종 (예: 돼지고기구이)"><input type="text" id="mAddress" placeholder="주소 (예: 서울 마포구 백범로 170)"></div>
      </details>
    </div>

    <label class="cap" for="title" id="titleCap">제목 또는 주제</label>
    <input type="text" id="title" maxlength="200" placeholder="블로그 글 제목이나 주제를 입력해주세요" autocomplete="off">
    <div class="row" style="margin-top:10px">
      <button class="btn" id="btnTitles" style="flex:1">제목 자동 생성</button>
      <button class="btn ghost" id="btnRegen" title="제목 다시 생성 (R)">⟳<kbd>R</kbd></button>
    </div>
    <div id="candidates" class="hidden" style="margin-top:12px"><div id="candList"></div></div>

    <label class="cap" for="kw">핵심 키워드 <small>— 검색 노출용. 제목에서 자동으로 채워지고 수정할 수 있어요 (쉼표로 구분)</small></label>
    <input type="text" id="kw" placeholder="예) 락희옥 마포본점, 마포, 공덕역">

    <label class="cap" for="memo" id="memoCap">메모</label>
    <textarea id="memo" maxlength="4000"></textarea>
    <p class="hint" id="memoHint"></p>

    <div class="opts">
      <label><input type="checkbox" id="guardrail"> 표시·광고 가드레일 <small style="color:var(--sub)">(효능 단정·암시 표현 제한)</small></label>
      <label>경험 서술
        <select id="evidence">
          <option value="strict">메모에 있는 것만</option>
          <option value="template">메모 + 일반 표현 허용</option>
        </select>
      </label>
    </div>

    <button class="btn wide" id="btnWrite" disabled>원고 생성하기</button>
    <div class="error" id="error"></div>
  </div>

  <div class="card" id="resultCard">
    <h2>생성 결과</h2>
    <div class="result-box" id="resultBox"><div class="empty">원고 제목을 입력하세요.<br>원고를 생성하면 결과가 여기에 표시됩니다.</div></div>
    <div id="notes" class="notes"></div>
    <div class="actions hidden" id="actions">
      <button class="btn" id="btnCopy">복사<kbd>C</kbd></button>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)" title="네이버 에디터 제목 칸에 붙여넣으면 첫 줄은 제목, 나머지는 본문으로 들어가요"><input type="checkbox" id="copyTitle" checked> 복사에 제목 포함</label>
      <button class="btn ghost hidden" id="btnRewrite">품질 점검 반영해서 다시 쓰기</button>
      <button class="btn dark" id="btnNew">새 원고<kbd>N</kbd></button>
    </div>
    <div id="quality"></div>
  </div>
</section>

<section id="viewList" class="hidden">
  <div class="card"><h2>내 원고</h2><div id="listBox"><div class="empty">불러오는 중...</div></div></div>
</section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const COLORS = ['#e03131', '#1c7ed6', '#d6336c'];
const KIND_LABEL = { info: '정보글', food: '맛집글' };
const state = { kind: 'info', place: null, titles: [], busy: false, article: null };

/* ---------- 글 종류별 화면 ---------- */
const KIND_UI = {
  info: {
    titleCap: '제목 또는 주제', memoCap: '내 경험·의견·참고 자료 (선택)',
    memoPh: '예) 직접 겪은 일, 꼭 넣고 싶은 의견이나 주의점, 참고한 자료와 출처를 적어 주세요.\n비워도 되지만, 적을수록 내 글처럼 구체적으로 써져요.',
    memoHint: '적어 준 내용이 글의 뼈대가 되고, 적지 않은 사실은 지어내지 않아요.', guardrail: true,
  },
  food: {
    titleCap: '제목 또는 키워드', memoCap: '방문 소감·느낀 점 (권장)',
    memoPh: '예) 금요일 저녁 동료 4명과 방문. 항정살 1인분 18,000원, 직원이 불판을 계속 갈아줘서 편했음.\n웨이팅 20분, 주차 불가. 아쉬운 점: 된장찌개가 짰음. 다시 간다면 평일 이른 시간.',
    memoHint: '메뉴·가격·분위기·기분·아쉬운 점을 편하게 적어 주세요. 여기 적은 내용만 후기 경험으로 쓰여요.', guardrail: false,
  },
};

function setKind(kind) {
  state.kind = kind;
  const ui = KIND_UI[kind];
  document.querySelectorAll('#chips .chip').forEach((b) => b.classList.toggle('active', b.dataset.kind === kind));
  $('foodBox').classList.toggle('hidden', kind !== 'food');
  $('titleCap').textContent = ui.titleCap; $('memoCap').textContent = ui.memoCap;
  $('memo').placeholder = ui.memoPh; $('memoHint').textContent = ui.memoHint;
  $('guardrail').checked = ui.guardrail;
}
document.querySelectorAll('#chips .chip').forEach((b) => (b.onclick = () => setKind(b.dataset.kind)));

/* ---------- 공통 유틸 ---------- */
function showError(msg) { const el = $('error'); el.textContent = msg || ''; el.classList.toggle('show', !!msg); }
function setBusy(busy) { state.busy = busy; ['btnTitles', 'btnRegen', 'btnWrite', 'btnRewrite', 'btnPlace'].forEach((id) => ($(id).disabled = busy || (id === 'btnWrite' && !$('title').value.trim()))); }
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
$('title').addEventListener('input', () => { $('btnWrite').disabled = state.busy || !$('title').value.trim(); });

async function api(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청에 실패했어요.');
  return data;
}
const postJSON = (url, body) => api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

async function streamSSE(url, body, onEvent) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || '요청에 실패했어요.'); }
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = (block.match(/^event: (.+)$/m) || [])[1]; const data = (block.match(/^data: (.+)$/m) || [])[1];
      if (ev && data) onEvent(ev, JSON.parse(data));
    }
  }
}

/* ---------- 본문 렌더링 / 복사 ---------- */
const TAG_RE = /\{\{(\/?)(bold|color|highlight)\}\}/g;
const isHead = (p) => /^\d+\.\s/.test(p.replace(TAG_RE, ''));
const isTags = (p) => p.startsWith('#') && (p.match(/#/g) || []).length >= 3;
const stripTags = (t) => t.replace(TAG_RE, '');
const paragraphs = (t) => t.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);

function countChars(text) {
  const ps = paragraphs(stripTags(text));
  for (let i = ps.length - 1; i >= 0; i--) if (isTags(ps[i])) { ps.splice(i, 1); break; }
  return ps.join('\n').replace(/\s/g, '').length;
}

function inline(par, counter, mode) {
  // mode: 'view' 은 화면용, 'copy' 는 네이버 붙여넣기용(형광펜은 굵게로 대체)
  const stack = []; let out = ''; let pos = 0; const s = esc(par);
  s.replace(TAG_RE, (m, close, name, idx) => {
    out += s.slice(pos, idx); pos = idx + m.length;
    if (!close) {
      let open = '', end = '';
      if (name === 'bold') { open = '<b>'; end = '</b>'; }
      else if (name === 'highlight') { open = mode === 'view' ? '<mark>' : '<b>'; end = mode === 'view' ? '</mark>' : '</b>'; }
      else { const c = COLORS[counter.n++ % COLORS.length]; open = mode === 'view' ? `<b style="color:${c}">` : `<span style="color:${c};font-weight:700">`; end = mode === 'view' ? '</b>' : '</span>'; }
      stack.push([name, end]); out += open;
    } else {
      const i = stack.map((x) => x[0]).lastIndexOf(name);
      if (i >= 0) { while (stack.length > i) out += stack.pop()[1]; }
    }
    return m;
  });
  out += s.slice(pos);
  while (stack.length) out += stack.pop()[1];
  return out;
}

function renderBody(text) {
  const counter = { n: 0 };
  return paragraphs(text).map((p) => {
    if (p.includes('플레이스 지도 삽입')) return `<p class="mapline">${esc(p)}</p>`;
    if (isTags(p)) return `<p class="tags">${esc(p)}</p>`;
    const mark = (h) => h.replace(/\[확인 필요[^\]]*\]/g, '<span class="todo">$&</span>');  // 발행 전 직접 확인할 자리
    if (isHead(p)) return `<h3>${mark(inline(p, counter, 'view'))}</h3>`;
    return `<p>${mark(inline(p, counter, 'view'))}</p>`;
  }).join('');
}

function toCopyHTML(text) {
  const counter = { n: 0 };
  return paragraphs(text).map((p) => {
    if (isTags(p)) return `<p>${esc(p)}</p>`;
    if (isHead(p)) return `<p><b>${inline(p, counter, 'copy')}</b></p>`;
    return `<p>${inline(p, counter, 'copy')}</p>`;
  }).join('<p><br></p>');
}

let rafPending = false, lastText = '';
function scheduleRender(text) {
  lastText = text;
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; renderResult(lastText, true); });
}

function renderResult(text, streaming) {
  const box = $('resultBox');
  let wrap = box.querySelector('.article');
  if (!wrap) {
    box.innerHTML = '<div class="barline"><span id="statusText"></span><span id="counter"></span></div><div class="article"></div>';
    wrap = box.querySelector('.article');
  }
  wrap.innerHTML = renderBody(text);
  $('counter').innerHTML = `글자수(공백 제외) <b>${countChars(text).toLocaleString()}</b>자`;
  if (streaming) box.querySelector('.article').lastElementChild?.scrollIntoView?.({ block: 'nearest' });
}
function setStatus(msg, spin) { const el = $('statusText'); if (el) el.innerHTML = (spin ? '<span class="spinner"></span>' : '') + esc(msg || ''); }

function renderQuality(q) {
  if (!q || !q.checks) { $('quality').innerHTML = ''; return; }
  const rows = q.checks.map((c) => `<div class="qrow"><span class="${c.ok ? 'ok' : 'no'}">${c.ok ? '✓' : '⚠'}</span><span>${esc(c.label)}</span><span class="val">${esc(c.value)}</span><span class="tg">기준: ${esc(c.target)}</span></div>`).join('');
  $('quality').innerHTML = `<div class="quality"><h4>품질 점검 — ${q.ok_count} / ${q.total} 통과 <span style="font-weight:400;color:var(--sub)">(권장 기준이며 글을 막지 않아요)</span></h4>${rows}</div>`;
}

function showArticle(art) {
  state.article = art;
  renderResult(art.body, false);
  setStatus(`저장됨 · ${KIND_LABEL[art.kind] || ''} · ${art.title}`);
  renderQuality(art.quality);
  $('actions').classList.remove('hidden');
  $('btnRewrite').classList.toggle('hidden', !(art.quality && art.quality.issues && art.quality.issues.length));
  const u = art.usage || (art.options && art.options.usage);
  const usageText = u && u.model && u.model !== 'mock'
    ? `토큰 입력 ${u.input_tokens.toLocaleString()} · 출력 ${u.output_tokens.toLocaleString()}` + (u.cost_usd != null ? ` · 추정 비용 약 $${u.cost_usd.toFixed(3)} (${u.model})` : ` (${u.model})`)
    : '';
  $('notes').textContent = [...(art.notes || []), usageText].filter(Boolean).join(' · ');
}

/* ---------- 매장 검색 ---------- */
function placeStatus(msg, warn) { const el = $('placeStatus'); el.textContent = msg || ''; el.classList.toggle('warn', !!warn); }
async function searchPlace() {
  const q = $('placeQuery').value.trim();
  if (!q) { placeStatus('매장 이름을 입력해 주세요.', true); return; }
  state.place = null; $('placeList').innerHTML = ''; placeStatus('검색 중...');
  try {
    const data = await api('/api/places?query=' + encodeURIComponent(q));
    if (!data.places.length) { placeStatus('검색 결과가 없어요. 아래 직접 입력을 이용하세요.', true); return; }
    placeStatus(`${data.places.length}곳 찾았어요 — 주소를 보고 골라주세요`);
    data.places.forEach((p) => {
      const b = document.createElement('button'); b.className = 'list-item';
      b.innerHTML = `<b>${esc(p.name)}</b><span>${esc([p.category, p.address].filter(Boolean).join(' · '))}</span>`;
      b.onclick = () => {
        state.place = p; document.querySelectorAll('#placeList .list-item').forEach((x) => x.classList.remove('selected')); b.classList.add('selected');
        placeStatus(`선택됨: ${p.name} — 이 정보가 원고에 사실로 반영돼요.`);
      };
      $('placeList').append(b);
    });
    if (data.places.length === 1) $('placeList').firstElementChild.click();
  } catch (e) { placeStatus(e.message, true); }
}
$('btnPlace').onclick = searchPlace;
$('placeQuery').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) searchPlace(); });
$('placeQuery').addEventListener('input', () => { state.place = null; });

function currentPlace() {
  if (state.kind !== 'food') return null;
  if (state.place) return state.place;
  const name = $('placeQuery').value.trim();
  return name ? { name, category: $('mCategory').value.trim(), address: $('mAddress').value.trim(), phone: '' } : null;
}
const keywordList = () => $('kw').value.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
const commonBody = () => ({ kind: state.kind, memo: $('memo').value.trim(), place: currentPlace(), guardrail: $('guardrail').checked, evidence_mode: $('evidence').value });

/* ---------- 제목 후보 ---------- */
async function makeTitles(regen) {
  if (state.busy) return;
  showError(''); setBusy(true);
  const label = $('btnTitles').textContent; $('btnTitles').textContent = '생성 중...';
  try {
    const data = await postJSON('/api/titles', { ...commonBody(), keyword: $('title').value.trim() || (currentPlace() || {}).name || '', exclude: regen ? state.titles : [] });
    state.titles = data.titles;
    $('candList').innerHTML = '';
    data.titles.forEach((t) => {
      const b = document.createElement('button'); b.className = 'list-item'; b.textContent = t;
      b.onclick = () => { $('title').value = t; $('btnWrite').disabled = false; $('candidates').classList.add('hidden'); };
      $('candList').append(b);
    });
    $('candidates').classList.remove('hidden');
    if (!$('kw').value.trim() && data.keywords) $('kw').value = data.keywords.join(', ');
  } catch (e) { showError(e.message); }
  finally { $('btnTitles').textContent = label; setBusy(false); }
}
$('btnTitles').onclick = () => makeTitles(false);
$('btnRegen').onclick = () => makeTitles(true);

/* ---------- 원고 생성 ---------- */
async function runStream(url, body) {
  showError(''); setBusy(true); $('actions').classList.add('hidden'); $('quality').innerHTML = ''; $('notes').textContent = '';
  $('resultBox').innerHTML = '<div class="barline"><span id="statusText"></span><span id="counter"></span></div><div class="article"></div>';
  setStatus('요청 중...', true);
  let raw = '';
  try {
    await streamSSE(url, body, (ev, d) => {
      if (ev === 'status') setStatus(d.text, true);
      else if (ev === 'chunk') { raw += d.text; scheduleRender(raw); }
      else if (ev === 'replace') { raw = d.text; renderResult(raw, false); }
      else if (ev === 'done') showArticle({ id: d.article_id, kind: body.kind || state.article?.kind || state.kind, title: d.title, body: d.body, quality: d.quality, notes: d.notes, usage: d.usage });
      else if (ev === 'error') throw new Error(d.message);
    });
    $('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    showError(e.message); setStatus('원고를 만들지 못했어요.');
  } finally { setBusy(false); }
}

$('btnWrite').onclick = () => {
  if (state.busy) return;
  runStream('/api/articles/stream', { ...commonBody(), title: $('title').value.trim(), keywords: keywordList() });
};
$('btnRewrite').onclick = () => { if (!state.busy && state.article) runStream(`/api/articles/${state.article.id}/rewrite`, { kind: state.article.kind }); };

/* ---------- 복사 / 새 원고 ---------- */
async function copyArticle() {
  if (!state.article) return;
  const text = state.article.body;
  const withTitle = $('copyTitle').checked && state.article.title;
  const plain = (withTitle ? state.article.title + '\n\n' : '') + paragraphs(stripTags(text)).join('\n\n');
  const html = (withTitle ? `<p>${esc(state.article.title)}</p><p><br></p>` : '') + toCopyHTML(text);
  const btn = $('btnCopy'); const old = btn.innerHTML;
  try {
    if (window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([plain], { type: 'text/plain' }) })]);
    } else { await navigator.clipboard.writeText(plain); }
    btn.textContent = '복사됨 ✓ — 네이버 에디터에 붙여넣기';
  } catch { btn.textContent = '복사 실패'; }
  setTimeout(() => { btn.innerHTML = old; }, 2200);
}
$('btnCopy').onclick = copyArticle;
function newArticle() {
  state.article = null; $('title').value = ''; $('memo').value = ''; $('kw').value = ''; $('candidates').classList.add('hidden');
  $('placeQuery').value = ''; state.place = null; $('placeList').innerHTML = ''; placeStatus('');
  $('resultBox').innerHTML = '<div class="empty">원고 제목을 입력하세요.<br>원고를 생성하면 결과가 여기에 표시됩니다.</div>';
  $('actions').classList.add('hidden'); $('quality').innerHTML = ''; $('notes').textContent = ''; $('btnWrite').disabled = true; showError('');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('btnNew').onclick = newArticle;

/* ---------- 내 원고 ---------- */
function showView(name) {
  $('viewWrite').classList.toggle('hidden', name !== 'write'); $('viewList').classList.toggle('hidden', name !== 'list');
  $('tabWrite').classList.toggle('active', name === 'write'); $('tabList').classList.toggle('active', name === 'list');
  if (name === 'list') loadList();
}
$('tabWrite').onclick = () => showView('write'); $('tabList').onclick = () => showView('list');

async function loadList() {
  const box = $('listBox');
  try {
    const { articles } = await api('/api/articles');
    if (!articles.length) { box.innerHTML = '<div class="empty">아직 만든 원고가 없어요.</div>'; return; }
    box.innerHTML = '';
    articles.forEach((a) => {
      const row = document.createElement('div'); row.className = 'li-row';
      const b = document.createElement('button'); b.className = 'list-item';
      b.innerHTML = `<b>${esc(a.title)}</b><span><i class="badge ${a.kind}" style="font-style:normal">${KIND_LABEL[a.kind] || a.kind}</i>${esc(a.created_at)} · ${a.chars.toLocaleString()}자</span>`;
      b.onclick = async () => { const { article } = await api('/api/articles/' + a.id); showView('write'); showArticle(article); $('resultCard').scrollIntoView({ behavior: 'smooth' }); };
      const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.title = '삭제';
      x.onclick = async () => { if (!confirm('이 원고를 삭제할까요?')) return; await api('/api/articles', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: [a.id] }) }); loadList(); };
      row.append(b, x); box.append(row);
    });
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- 단축키: R 제목 다시, C 복사, N 새 원고 ---------- */
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'r') { e.preventDefault(); makeTitles(true); }
  else if (k === 'c' && state.article) { e.preventDefault(); copyArticle(); }
  else if (k === 'n') { e.preventDefault(); newArticle(); }
});

setKind('info');
</script>
</body>
</html>
