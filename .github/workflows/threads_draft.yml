name: 쓰레드 초안 발송

# 개인 PC를 켜두지 않아도, GitHub 서버가 대신 하루 3번 실행해줌.
# 시간은 UTC 기준이라 한국시간(KST, UTC+9)에서 9시간을 뺀 값으로 적음.
# 정각(00분)은 전 세계적으로 요청이 몰려 GitHub가 지연/누락시키는 경우가
# 많다고 공식 문서에 명시돼 있어, 일부러 애매한 분으로 분산해둠.
on:
  schedule:
    - cron: '7 23 * * *'   # 매일 08:07 KST (목표 08:00)
    - cron: '12 3 * * *'   # 매일 12:12 KST (목표 12:00)
    - cron: '18 9 * * *'   # 매일 18:18 KST (목표 18:03)
  workflow_dispatch: {}    # GitHub 웹사이트/앱에서 "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write  # threads_state.json을 다시 커밋하기 위해 필요

jobs:
  send-threads-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 이 시간 넘으면 자동 실패 처리 (무한정 멈춰있는 것 방지)
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # 다음 실행부터는 패키지 재다운로드 없이 캐시로 빠르게

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 쓰레드 초안 생성 및 DM 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELETHON_STRING_SESSION: ${{ secrets.TELETHON_STRING_SESSION }}
        run: python threads_once.py

      - name: 상태 파일(threads_state.json) 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add threads_state.json
          git diff --cached --quiet || git commit -m "쓰레드 상태 업데이트"
          git push
