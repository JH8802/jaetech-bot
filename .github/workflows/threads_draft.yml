name: 쓰레드 초안 발송

# 개인 PC를 켜두지 않아도 하루 3번 실행되도록, 외부 서비스(cron-job.org)가
# 정확한 시각(08:00/12:00/18:03 KST)에 이 워크플로우를 직접 호출해줌.
#
# GitHub 자체 schedule 트리거는 "best-effort"라 정각 근처에 지연·누락이
# 잦다는 걸 실제로 여러 번 확인해서(최대 3시간 지연, 일부는 아예 누락)
# 제거함. 외부 트리거와 중복 실행되는 것도 방지하는 목적.
on:
  workflow_dispatch: {}    # GitHub 웹사이트/앱에서 수동 실행 + cron-job.org가 API로 호출

permissions:
  contents: write  # threads_state.json을 다시 커밋하기 위해 필요

jobs:
  send-threads-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 이 시간 넘으면 자동 실패 처리 (무한정 멈춰있는 것 방지)
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # 다음 실행부터는 패키지 재다운로드 없이 캐시로 빠르게

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 쓰레드 초안 생성 및 DM 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELETHON_STRING_SESSION: ${{ secrets.TELETHON_STRING_SESSION }}
        run: python threads_once.py

      - name: 상태 파일(threads_state.json) 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add threads_state.json
          git diff --cached --quiet || git commit -m "쓰레드 상태 업데이트"
          git push
